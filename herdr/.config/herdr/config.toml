onboarding = false
[keys]
prefix = "ctrl+space"
split_vertical = "prefix+d"
split_horizontal = "prefix+shift+d"
new_tab = "prefix+shift+t"
close_pane = "prefix+w"
close_tab = "prefix+shift+w"
rename_tab = "prefix+r"
workspace_picker = "prefix+alt+w"
rename_workspace = "prefix+alt+shift+w"
close_workspace = "prefix+alt+shift+d"
resize_mode = "prefix+alt+r"

[ui]
window_title = "{hostname}: {workspace}"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"
