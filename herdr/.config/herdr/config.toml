onboarding = false
[keys]
prefix = "ctrl+space"
split_vertical = "prefix+d"
split_horizontal = "prefix+shift+d"
focus_pane_right = "prefix+right"
close_pane = "prefix+w"
new_tab = "prefix+t"
close_tab = "prefix+shift+t"
rename_tab = "prefix+r"
new_workspace = "prefix+n"
close_workspace = "prefix+shift+n"
workspace_picker = "prefix+alt+w"
rename_workspace = "prefix+alt+shift+w"
resize_mode = "prefix+alt+r"

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"
